<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocko's Intelligence</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #111827; }
    main { width: min(760px, calc(100% - 40px)); background: white; border-radius: 18px; padding: 36px; box-shadow: 0 16px 50px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    .ok { display: inline-block; padding: 7px 12px; border-radius: 999px; background: #dcfce7; color: #166534; font-weight: 700; }
    code { background: #f3f4f6; padding: 3px 7px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <span class="ok">Aplicación activa</span>
    <h1>Rocko's Intelligence</h1>
    <p>La base técnica para conectar Mercado Libre está publicada correctamente.</p>
    <p>Callback OAuth: <code>/api/mercadolibre/callback</code></p>
    <p>Notificaciones: <code>/api/mercadolibre/notificaciones</code></p>
  </main>
</body>
</html>
